[project]
name = "o-mcp"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "jsonschema>=4.26.0",
    "mcp>=1.20",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["server/tests", "api/tests"]
